<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cuenta regresiva – Karlita</title>

  <!-- CSS compilado -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1 class="title">🎂 Cuenta regresiva para el cumpleaños de <span>Mi Karlita 💖</span></h1>

    <section id="timer" class="timer">
      <div class="box box-days">
        <div id="days" class="numbers">0</div>
        <div class="label">DÍAS</div>
      </div>
      <div class="box box-hours">
        <div id="hours" class="numbers">00</div>
        <div class="label">HORAS</div>
      </div>
      <div class="box box-minutes">
        <div id="minutes" class="numbers">00</div>
        <div class="label">MINUTOS</div>
      </div>
      <div class="box box-seconds">
        <div id="seconds" class="numbers">00</div>
        <div class="label">SEGUNDOS</div>
      </div>
    </section>

    <p id="mensaje" class="mensaje"></p>
  </main>

  <!-- Confeti (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Tu JS -->
  <script src="script.js"></script>
</body>
</html>
